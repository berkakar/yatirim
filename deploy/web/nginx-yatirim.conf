# install_web.sh tarafından /etc/nginx/sites-available/yatirim olarak kurulur;
# __SERVER_NAME__ alan adı (ya da "_") ile değiştirilir. HTTPS bloğunu certbot ekler.

# WebSocket: istemci "Upgrade" gönderiyorsa Connection: upgrade, göndermiyorsa close.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    client_max_body_size 200m;   # Streamlit'in varsayılan dosya yükleme sınırı

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit tarayıcıyla WebSocket (/_stcore/stream) üzerinden konuşur;
        # bu iki başlık olmadan sayfa sonsuza kadar "Please wait..." der.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Açık sekmedeki WebSocket bağlantısı 60 sn'de kopmasın.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
