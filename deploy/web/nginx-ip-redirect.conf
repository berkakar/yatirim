# install_web.sh tarafından alan adı verildiğinde /etc/nginx/sites-available/yatirim-ip-redirect
# olarak kurulur; __TARGET__ "https://alan-adı" (ya da sertifika yoksa "http://alan-adı") olur.
# Alan adıyla eşleşmeyen her istek (örn. tarayıcıya IP yazılması) buraya düşer.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 __TARGET__$request_uri;
}

# https://<IP>: sertifika alan adına ait olduğundan burada yönlendirme yapılamaz (tarayıcı önce
# sertifika uyarısı gösterir). Bağlantıyı reddediyoruz; tarayıcı http'ye düşer ve yukarıdaki
# blok alan adına yönlendirir.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}
