# Nginx reverse proxy: dışarıdan gelen istekleri 127.0.0.1:8501'deki Streamlit'e iletir.
# setup.sh bu dosyayı /etc/nginx/sites-available/yatirim olarak kopyalar ve
# server_name satırını alan adınızla değiştirir. HTTPS (443) blokları certbot
# tarafından otomatik eklenir.

# Streamlit WebSocket (/_stcore/stream) kullanır; Upgrade başlığı gelirse
# bağlantıyı "upgrade" olarak iletmek gerekir.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Streamlit'in varsayılan dosya yükleme sınırı (200 MB) ile uyumlu.
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Açık sekmelerin WebSocket bağlantısı uzun süre boşta kalabilir.
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
