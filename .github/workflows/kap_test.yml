name: KAP Test (geçici, manuel)

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Test edilecek fon kodu"
        required: true
        default: "AAK"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python kap_fund_holdings_test.py --code "${{ github.event.inputs.code }}"
