name: Alpaca Extended Hours Entries

# Not: Alpaca, extended hours'ta (04:00-09:30 ve 16:00-20:00 ET) bracket/OTO
# emirlere izin vermiyor - sadece düz limit emirler çalışıyor. Bu workflow,
# bu pencerelerde yeni giriş sinyallerini tarar, düz bir extended-hours
# limit-buy gönderir/günceller, ve kendi içinde birkaç dakika boyunca sıkı
# bir döngüyle dolup dolmadığını kontrol eder - dolduğu anda hemen bir
# koruma (naif %INITIAL_STOP_PCT) limit-sell kurar. Bkz.
# alpaca_buy_points.py'deki run_extended_hours_entry_scan.
#
# Ayrı bir job'ta çalışır (alpaca_extended_hours_guard.yml'den bağımsız),
# böylece bu taramanın kendi içindeki uzun poll döngüsü, mevcut
# pozisyonları koruyan guard'ın kendi çalışmasını hiç geciktirmez.
#
# Cron saatleri UTC'dir ve ET'nin yaz saatini (EDT, UTC-4) varsayar - diğer
# workflow'larla aynı varsayım; kış saatinde (EST) pencereler bir saat
# kayar, script kendi içinde extended_hours_session ile bunu takvimden
# doğrulayıp gerekirse no-op yapar.
on:
  schedule:
    - cron: "*/10 8-13 * * 1-5"   # ~04:00-09:59 ET pre-market
    - cron: "*/10 20-23 * * 1-5"  # ~16:00-19:59 ET after-hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: alpaca-extended-hours-entries
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python alpaca_buy_points.py --extended-hours-entries
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: https://paper-api.alpaca.markets/v2
          APCA_API_DATA_URL: https://data.alpaca.markets/v2
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      # alpaca_trailing_stop.yml'deki aynı state cache'lerinin (management_start
      # hariç - o sadece manage_position/trailing-stop tarafında kullanılıyor)
      # bu workflow'un dokunduğu kısmı - bkz. o dosyadaki commit adımının notu.
      - name: Commit and push updated Alpaca state cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in alpaca_realized_pnl_cache_berkakar.json alpaca_daily_bars_cache_berkakar.json alpaca_intraday_bars_cache_berkakar.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
          else
            git commit -m "Update Alpaca automation state cache"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt), pulling and retrying..."
              git pull --rebase --autostash
            done
          fi
