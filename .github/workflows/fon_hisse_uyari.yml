name: Fonlarım Hisse Düşüş Uyarısı

# NOT: GitHub'ın "*/5 * * * *" gibi çok sık schedule tetikleyicileri
# GERÇEKTE güvenilir çalışmıyor - bu workflow'da 2026-09-11'den beri
# */5 7-15 * * 1-5 tanımlıydı ama Actions run geçmişinde saatler arası
# boşluklarla sadece birkaç run oluştu (bazı günler hiç). Bu yüzden
# tetikleyici günde sadece 2 kez ateşleniyor (bunların GERÇEKTEN
# çalışma ihtimali çok daha yüksek), her tetiklenmede iş BIST işlem
# penceresinin yarısı kadar (~4 saat) canlı kalıp döngü içinde 5
# dakikada bir kontrol ediyor - böylece asıl "5 dakikada bir kontrol"
# davranışı GitHub'ın schedule event'ine değil, job içindeki sleep
# döngüsüne dayanıyor.
on:
  schedule:
    - cron: "5 7 * * 1-5"   # 10:05 TRT (BIST açılışı) - ilk ~4 saatlik pencere
    - cron: "5 11 * * 1-5"  # 14:05 TRT - ikinci ~4 saatlik pencere
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Hisseleri kontrol et (schedule ise ~4 saat boyunca 5 dakikada bir, manuel ise tek seferlik)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          push_state() {
            git add bildirim_durumu.json
            if git diff --cached --quiet; then
              return
            fi
            git commit -m "Update bildirim durumu"
            for i in 1 2 3; do
              if git push; then
                return
              fi
              git fetch origin main
              git rebase origin/main
            done
          }

          if [ "${{ github.event_name }}" = "schedule" ]; then
            END=$((SECONDS + 235 * 60))
            while true; do
              python fon_hisse_uyari.py --once
              push_state
              if [ $SECONDS -ge $END ]; then
                break
              fi
              sleep 300
            done
          else
            python fon_hisse_uyari.py --once
            push_state
          fi
