name: Türk Fonları (TEFAS)

on:
  schedule:
    - cron: "0 6 * * 1-5"   # 09:00 TRT (sabah)
    - cron: "0 10 * * 1-5"  # 13:00 TRT (öğlen)
    - cron: "10 16 * * 1-5" # 19:10 TRT (akşam, TEFAS fiyatları tamamladıktan 10 dk sonra)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python tefas_fetch.py --once

      - name: Commit and push updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tefas_fonlari_cache.json
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
          else
            git commit -m "Update Türk Fonları cache"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt), pulling and retrying..."
              git pull --rebase --autostash
            done
          fi
