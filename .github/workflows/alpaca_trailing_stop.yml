name: Alpaca Trailing Stop

on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

# Aynı pass'in üst üste binmesini (ör. bir çalıştırma 5 dakikadan uzun sürerse)
# önler - artık aşağıdaki state cache dosyalarına da yazıldığı için, iki
# eşzamanlı çalıştırmanın aynı dosyaya çakışan commit atması riskini de
# ortadan kaldırır.
concurrency:
  group: alpaca-trailing-stop
  cancel-in-progress: false

jobs:
  trail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python alpaca_buy_points.py --once
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: https://paper-api.alpaca.markets/v2
          APCA_API_DATA_URL: https://data.alpaca.markets/v2

      - run: python alpaca_trailing_stop.py --once
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: https://paper-api.alpaca.markets/v2
          APCA_API_DATA_URL: https://data.alpaca.markets/v2

      # alpaca_bars_cache.py / alpaca_realized_pnl_cache.py / get_management_start
      # (alpaca_trailing_stop.py) tarafından güncellenen state cache'leri - her
      # ~5 dakikada bir aynı bar/order-history pencerelerini Alpaca'dan sıfırdan
      # çekmemek için buradan devam eder. Gerçek bir değişiklik yoksa (yeni bar
      # kapanmadı, yeni fill olmadı) diff boş kalır ve commit atlanır - bu
      # yüzden commit sıklığı poll aralığına değil, altta yatan verinin
      # gerçekten değişme sıklığına bağlıdır.
      - name: Commit and push updated Alpaca state cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in alpaca_realized_pnl_cache_berkakar.json alpaca_daily_bars_cache_berkakar.json alpaca_intraday_bars_cache_berkakar.json alpaca_position_management_cache_berkakar.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
          else
            git commit -m "Update Alpaca automation state cache"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt), pulling and retrying..."
              git pull --rebase --autostash
            done
          fi
