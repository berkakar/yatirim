# Bu dosya sadece ilk sayfa boyası ve theme.py'nin CSS ile geçersiz kılamadığı
# yerleşik bileşenler (örn. Styler kullanmayan çıplak st.dataframe/st.data_editor
# ızgaraları, tooltip/toast) için statik bir geri düşüş sağlar. Uygulamanın asıl
# gündüz/gece geçişi, login ekranındaki anahtarla theme.py üzerinden CSS enjekte
# ederek çalışır - bkz. theme.py. Buradaki değerler "Gündüz" paletiyle eşleşir.
[theme]
base = "light"
primaryColor = "#0a7f72"
backgroundColor = "#f4f9f8"
secondaryBackgroundColor = "#dcebe6"
textColor = "#0f2a2c"
font = "sans serif"
